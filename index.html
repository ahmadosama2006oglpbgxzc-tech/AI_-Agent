<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منظومة الحجوزات الذكية</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .chat-container { width: 100%; max-width: 500px; background: white; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: flex; flex-direction: column; height: 85vh; overflow: hidden; }
        .chat-header { background: #0078d4; color: white; padding: 15px; text-align: center; font-size: 1.2rem; font-weight: bold; }
        .chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { padding: 10px 15px; border-radius: 10px; max-width: 75%; font-size: 0.95rem; line-height: 1.4; }
        .user { background: #0078d4; color: white; align-self: flex-end; border-bottom-right-radius: 0; }
        .bot { background: #e4e6eb; color: #050505; align-self: flex-start; border-bottom-left-radius: 0; }
        .chat-input-area { display: flex; padding: 10px; border-top: 1px solid #e4e6eb; background: #f0f2f5; }
        .chat-input { flex: 1; padding: 10px; border: 1px solid #ccd0d5; border-radius: 20px; outline: none; font-size: 1rem; }
        .send-btn { background: #0078d4; color: white; border: none; padding: 0 15px; margin-right: 5px; border-radius: 20px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">المساعد الذكي المؤتمت 🚀</div>
    <div class="chat-messages" id="chatMessages">
        <div class="message bot">مرحباً بك! كيف يمكنني مساعدتك اليوم بخصوص الحجوزات؟</div>
    </div>
    <div class="chat-input-area">
        <input type="text" id="chatInput" class="chat-input" placeholder="اكتب رسالتك هنا بلهجتك المفضلة..." autocomplete="off">
        <button class="send-btn" onclick="sendMessage()">إرسال</button>
    </div>
</div>

<script>
    async sendMessage() {
        const input = document.getElementById('chatInput');
        const text = input.value.trim();
        if (!text) return;

        appendMessage(text, 'user');
        input.value = '';

        try {
            // استدعاء السيرفر السحابي لمعالجة الرسالة وعكس اللهجة تلقائياً
            const response = await fetch('https://[رابط-سيرفرك-السحابي]/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: text })
            });
            const data = await response.json();
            
            // تنظيف نص الرد من أكواد الـ JSON قبل عرضه للمستخدم البشري
            let cleanReply = data.reply.replace(/\{.*\}/gs, '').trim();
            appendMessage(cleanReply, 'bot');
        } catch (error) {
            appendMessage('عذراً، حدث خطأ في الاتصال بالسيرفر السحابي.', 'bot');
        }
    }

    function appendMessage(text, sender) {
        const container = document.getElementById('chatMessages');
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${sender}`;
        msgDiv.innerText = text;
        container.appendChild(msgDiv);
        container.scrollTop = container.scrollHeight;
    }
</script>
</body>
</html>
